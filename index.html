<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="CreditMate AI - Making financial decisions simpler for Bangladeshi consumers"
    />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- Hind Siliguri 400 (the body weight) in both subsets the UI ships:
         preloaded so first paint uses the real face, with font-display:
         swap in fonts.css as the fallback contract. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/hind-siliguri-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/hind-siliguri-400-bengali.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>CreditMate AI</title>
    <script src="%BASE_URL%theme-init.js"></script>
    <!-- First-paint ground: mirrors --color-background-base per theme (set by
         theme-init.js above) so the canvas never flashes white before the
         bundle CSS arrives. Keep in step with design-tokens color bases. -->
    <style>
      html {
        background-color: #eceef3;
      }
      html.dark {
        background-color: #0a0f1a;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
