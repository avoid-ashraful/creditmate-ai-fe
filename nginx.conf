# Serves the static Vite build with SPA fallback.
# Mirrors the Kubernetes frontend (unprivileged nginx) so Docker and k8s
# serve the app the same way.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other route returns the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell itself must never be cached, so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
